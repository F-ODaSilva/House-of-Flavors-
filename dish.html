<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dish · House of Flavors</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <meta name="theme-color" content="#030c0e">
  <link rel="icon" href="assets/img/logo-hof.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Eagle+Lake&family=Roboto+Slab:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/system.css">
  <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="menu">

<main>
  <section class="dish-page">
    <div class="wrap dish-grid" id="dishRoot">
      <figure class="dish-photo"><img id="dPhoto" alt="" width="1600" height="2000"></figure>
      <div class="dish-info">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><a href="menu.html">Menu</a><span aria-hidden="true">/</span><a id="dCatLink" href="menu.html"></a></nav>
        <div class="stack" style="gap:12px">
          <h1 id="dName"></h1>
          <div class="row" id="dTags"></div>
        </div>
        <div class="row" style="justify-content:space-between">
          <span class="price" id="dPrice"></span>
          <span class="rating muted" id="dRate"></span>
        </div>
        <p class="lede" id="dDesc" style="max-width:46ch"></p>
        <div class="dish-buy">
          <div class="qty" role="group" aria-label="Quantity">
            <button id="qMinus" aria-label="One less"><svg aria-hidden="true"><use href="assets/icons.svg#minus"/></svg></button>
            <output id="qOut" aria-live="polite">1</output>
            <button id="qPlus" aria-label="One more"><svg aria-hidden="true"><use href="assets/icons.svg#plus"/></svg></button>
          </div>
          <button class="btn" id="addBtn" style="flex:1">Add to order</button>
        </div>
        <dl class="facts">
          <div><dt>Station</dt><dd id="fStation"></dd></div>
          <div><dt>Ready in</dt><dd id="fReady"></dd></div>
          <div><dt>Serves</dt><dd id="fServes"></dd></div>
        </dl>
        <div class="stack">
          <h2 style="font-size:1.6rem">Goes well with</h2>
          <div class="pairings" id="dPairs"></div>
        </div>
        <div class="stack">
          <h2 style="font-size:1.6rem">From the table</h2>
          <div class="review-list" id="dReviews"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="paper band tight" aria-labelledby="moreTitle">
    <div class="wrap">
      <div class="section-head split">
        <h2 id="moreTitle">More from the station</h2>
        <a class="btn ghost" id="moreLink" href="menu.html">See the section</a>
      </div>
      <div class="dishes" id="dMore"></div>
    </div>
  </section>
</main>

<footer data-shell></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/dish.js"></script>
</body>
</html>
